<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060b10" />
    <script>
      // The theme before first paint, so the page never flashes the wrong one (src/lib/theme.ts).
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('fusion.theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark')
          t =
            window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#e9eef3'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/fusion-mark.svg" />
    <title>Homeland Fusion Centre</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
